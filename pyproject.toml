[project]
name = "insightwellness_ai"
version = "0.0.1"
description = "A short description of the project."
readme = "README.md"
dependencies = [
    "fsspec>=2026.2.0",
    "gcsfs>=2026.2.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
default-groups = ["api", "streamlit", "vertex", "agents", "dev"]

[dependency-groups]
agents = [
    "agno>=2.6.4",
    "chromadb>=1.5.8",
    "ddgs>=9.14.1",
    "flask>=3.1.3",
    "google-genai>=1.68.0",
    "gunicorn>=25.3.0",
    "requests>=2.32.3",
]
api = [
    "flasgger>=0.9.7.1",
    "flask>=3.1.3",
    "google-auth>=2.49.1",
    "google-cloud-storage>=3.10.0",
    "gunicorn>=25.3.0",
    "joblib>=1.5.3",
    "numba>=0.59.0",
    "scikit-learn>=1.7.2",
    "shap>=0.45.0",
]
streamlit = [
    "plotly>=5.24.1",
    "requests>=2.32.3",
    "streamlit>=1.40.0",
]
vertex = [
    "altair>=6.0.0",
    "codecarbon>=3.2.5",
    "db-dtypes>=1.5.0",
    "google-cloud-aiplatform>=1.142.0",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-bigquery-storage>=2.36.2",
    "google-cloud-storage>=3.10.0",
    "joblib>=1.5.3",
    "kfp>=2.16.0",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.7.2",
]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.2",
]

[tool.ruff]

exclude = [
    ".git",
    ".vscode",
    "__pycache__",
]

line-length = 88
indent-width = 4

target-version = "py310"

[lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort (import sorting)
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

ignore = [
    "E501",
]

fixable = ["ALL"]

[lint.isort]
known-first-party = ["insightwellness_ai"]

[format]
quote-style = "double"

indent-style = "space"
