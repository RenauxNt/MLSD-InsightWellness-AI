[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "insightwellness_ai"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "python-dotenv",
]
requires-python = "~=3.10.0"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]

exclude = [
    ".git",
    ".vscode",
    "__pycache__",
]

line-length = 88
indent-width = 4

target-version = "py310"

[lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort (import sorting)
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

ignore = [
    "E501",
]

fixable = ["ALL"]

[lint.isort]
known-first-party = ["insightwellness_ai"]

[format]
quote-style = "double"

indent-style = "space"
