data:
  raw: gs://mlops-2026-ramzan1/raw/data_raw.csv
  preprocessed: gs://mlops-2026-ramzan1/preprocessed/data_preprocessed.csv
  train: gs://mlops-2026-ramzan1/splits/train.csv
  test: gs://mlops-2026-ramzan1/splits/test.csv

split:
  target: Obesity
  test_size: 0.2
  random_state: 42
  stratify: true

train:
  n_estimators: 500
  random_state: 257
  model_dir: models
  param_grid:
    max_depth: [3, 5, 7]
    learning_rate: [0.05, 0.1, 0.2]
