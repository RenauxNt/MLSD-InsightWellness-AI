name: Vertex AI Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build-and-run:
    name: Build Docker image & trigger vertex pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.vertex \
            -t europe-west1-docker.pkg.dev/mlsd-487610/vertex-ai-pipeline-example/pipeline-base:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: docker push europe-west1-docker.pkg.dev/mlsd-487610/vertex-ai-pipeline-example/pipeline-base:latest

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run Vertex AI pipeline
        run: uv run python -m vertex.run_pipeline
