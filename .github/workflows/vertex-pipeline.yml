name: Vertex AI Pipeline

# Continuous training: rebuilds the pipeline base image and re-runs the
# Vertex pipeline when training code or config changes on main. Gated on
# the same lint + test suite as the service deploys.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vertex/**'
      - 'insightwellness_ai/config.py'
      - 'insightwellness_ai/preprocess.py'
      - 'insightwellness_ai/training.py'
      - 'insightwellness_ai/evaluation.py'
      - 'insightwellness_ai/model_selection.py'
      - 'Dockerfile.vertex'
      - 'params.yaml'

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-run:
    name: Build Docker image & trigger vertex pipeline
    needs: tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/vertex-ai-pipeline-example/pipeline-base:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.vertex \
            -t "$IMAGE" \
            .

      - name: Push Docker image to Artifact Registry
        run: docker push "$IMAGE"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run Vertex AI pipeline
        run: uv run python -m vertex.run_pipeline
