name: Deploy Streamlit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Build & deploy Streamlit to Cloud Run
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.streamlit \
            -t europe-west1-docker.pkg.dev/mlsd-487610/insightwellness/streamlit-app:latest \
            .

      - name: Push Docker image
        run: docker push europe-west1-docker.pkg.dev/mlsd-487610/insightwellness/streamlit-app:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy streamlit-app \
            --project=mlsd-487610 \
            --image=europe-west1-docker.pkg.dev/mlsd-487610/insightwellness/streamlit-app:latest \
            --region=europe-west1 \
            --port=8501 \
            --allow-unauthenticated
